name: Publish site

# Builds the site with fresh NOAA wind data and publishes it to GitHub Pages.
# GFS runs every 6 hours and appears a few hours later; checking every 3 hours
# picks up each new run soon after it lands.
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygrib numpy
      - run: python scripts/fetch_wind.py data
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
